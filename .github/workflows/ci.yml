name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-check:
    runs-on: ubuntu-latest
    steps:
      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: npm run check:harness

  backend-check:
    runs-on: ubuntu-latest
    steps:
      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-check
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: filmott_test
      TEST_DB_PASSWORD: filmott_test
      TEST_DB_NAME: filmott_integration
    steps:
      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Build PostgreSQL image with pgvector
        run: docker build -t filmott-postgres-test ./postgres
      - name: Start PostgreSQL test container
        run: |
          docker run -d \
            --name filmott-integration-postgres \
            -e POSTGRES_USER="$TEST_DB_USERNAME" \
            -e POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e POSTGRES_DB="$TEST_DB_NAME" \
            -p "$TEST_DB_PORT:5432" \
            filmott-postgres-test
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec filmott-integration-postgres pg_isready -U "$TEST_DB_USERNAME" -d "$TEST_DB_NAME"; then
              exit 0
            fi
            sleep 2
          done
          docker logs filmott-integration-postgres
          exit 1
      - run: npm ci
        working-directory: backend
      - run: npm run test:e2e
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      - name: Stop PostgreSQL test container
        if: always()
        run: docker rm -f filmott-integration-postgres || true

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run frontend Playwright smoke
        run: npm run test:e2e
        working-directory: frontend

  production-config:
    runs-on: ubuntu-latest
    steps:
      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate Compose configuration
        env:
          DB_NAME: filmott_ci
          DB_USERNAME: filmott_ci
          DB_PASSWORD: filmott_ci
          NEXT_PUBLIC_GA_ID: G-CI000000
          NEXT_PUBLIC_SENTRY_DSN: https://public@example.invalid/1
          REVALIDATE_SECRET: ci-placeholder
        run: |
          set -Eeuo pipefail

          touch backend/.env backend/.env.production
          docker compose --env-file /dev/null -f docker-compose.yml config --quiet
          docker compose --env-file /dev/null -f docker-compose.prod.yml config --quiet
          production_config="$(docker compose --profile legacy --env-file /dev/null -f docker-compose.prod.yml config --format json)"
          for service in \
            nginx postgres \
            frontend-blue frontend-green backend-blue backend-green \
            frontend backend; do
            printf '%s\n' "$production_config" | jq -e --arg service "$service" '
              .services[$service].logging.driver == "json-file" and
              .services[$service].logging.options["max-size"] == "20m" and
              .services[$service].logging.options["max-file"] == "5"
            ' > /dev/null
          done
          printf '%s\n' "$production_config" | jq -e \
            '.services.certbot.logging == null' > /dev/null
      - name: Validate operations script safety
        run: bash scripts/ops-safety.test.sh
      - name: Validate nginx configuration
        run: |
          set -Eeuo pipefail

          cert_dir="$RUNNER_TEMP/filmott-nginx-certs/live/filmott.kr"
          runtime_dir="$RUNNER_TEMP/filmott-nginx-runtime"
          mkdir -p "$cert_dir"
          mkdir -p "$runtime_dir"
          printf '%s\n' \
            'map $host $filmott_active_slot { default "blue"; }' \
            'map $host $filmott_active_sha { default "0000000000000000000000000000000000000000"; }' \
            'map $host $filmott_previous_frontend { default "frontend-blue:3000"; }' \
            'upstream frontend { server frontend-blue:3000; }' \
            'upstream backend { server backend-blue:3001; }' \
            > "$runtime_dir/upstreams.conf"
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
            -subj '/CN=filmott.kr' \
            -keyout "$cert_dir/privkey.pem" \
            -out "$cert_dir/fullchain.pem"
          docker run --rm \
            --add-host frontend-blue:127.0.0.1 \
            --add-host backend-blue:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro" \
            -v "$runtime_dir:/etc/nginx/runtime:ro" \
            -v "$RUNNER_TEMP/filmott-nginx-certs:/etc/letsencrypt:ro" \
            nginx:alpine nginx -t

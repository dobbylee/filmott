name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npm run test:e2e
        working-directory: backend

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-check
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: filmott_test
      TEST_DB_PASSWORD: filmott_test
      TEST_DB_NAME: filmott_integration
    steps:
      # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Build PostgreSQL image with pgvector
        run: docker build -t filmott-postgres-test ./postgres
      - name: Start PostgreSQL test container
        run: |
          docker run -d \
            --name filmott-integration-postgres \
            -e POSTGRES_USER="$TEST_DB_USERNAME" \
            -e POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            -e POSTGRES_DB="$TEST_DB_NAME" \
            -p "$TEST_DB_PORT:5432" \
            filmott-postgres-test
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec filmott-integration-postgres pg_isready -U "$TEST_DB_USERNAME" -d "$TEST_DB_NAME"; then
              exit 0
            fi
            sleep 2
          done
          docker logs filmott-integration-postgres
          exit 1
      - run: npm ci
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      - name: Stop PostgreSQL test container
        if: always()
        run: docker rm -f filmott-integration-postgres || true

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  mcp-check:
    runs-on: ubuntu-latest
    steps:
      # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm run build
        working-directory: mcp

  production-artifacts:
    runs-on: ubuntu-latest
    steps:
      # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate Compose configuration
        env:
          DB_NAME: filmott_ci
          DB_USERNAME: filmott_ci
          DB_PASSWORD: filmott_ci
          NEXT_PUBLIC_GA_ID: G-CI000000
          NEXT_PUBLIC_SENTRY_DSN: https://public@example.invalid/1
          REVALIDATE_SECRET: ci-placeholder
        run: |
          set -Eeuo pipefail

          touch backend/.env backend/.env.production
          docker compose --env-file /dev/null -f docker-compose.yml config --quiet
          docker compose --env-file /dev/null -f docker-compose.prod.yml config --quiet
      - name: Validate nginx configuration
        run: |
          set -Eeuo pipefail

          cert_dir="$RUNNER_TEMP/filmott-nginx-certs/live/filmott.kr"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
            -subj '/CN=filmott.kr' \
            -keyout "$cert_dir/privkey.pem" \
            -out "$cert_dir/fullchain.pem"
          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro" \
            -v "$RUNNER_TEMP/filmott-nginx-certs:/etc/letsencrypt:ro" \
            nginx:alpine nginx -t
      - name: Set up QEMU
        # v4.2.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build backend production image
        run: docker buildx build --platform linux/arm64 --load -t filmott-backend-ci ./backend
      - name: Build frontend production image
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg NEXT_PUBLIC_API_URL=https://example.invalid/api \
            --build-arg NEXT_PUBLIC_GA_ID=G-CI000000 \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=https://public@example.invalid/1 \
            -t filmott-frontend-ci ./frontend

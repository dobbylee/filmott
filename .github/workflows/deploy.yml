name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      require_sse:
        description: Verify one existing chat SSE across cutover
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          vars.FILMOTT_BLUE_GREEN_READY == '1') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact SHA CI for manual deploy
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          success_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${VERIFY_SHA}&event=push&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          [ "$success_count" -ge 1 ] || {
            echo "No successful CI run for ${VERIFY_SHA}"
            exit 1
          }
      - name: Deploy verified commit
        # v1.2.5
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          FILMOTT_REQUIRE_SSE_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_sse && '1' || '0' }}
          FILMOTT_REQUIRE_CUTOVER: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,FILMOTT_REQUIRE_SSE_SMOKE,FILMOTT_REQUIRE_CUTOVER
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            cd ~/filmott

            if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid deploy SHA: ${DEPLOY_SHA}"
              exit 1
            fi
            echo "Deploy target: ${DEPLOY_SHA}"
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git cat-file -e "${DEPLOY_SHA}^{commit}"; then
              echo "Deploy target is not a commit: ${DEPLOY_SHA}"
              exit 1
            fi

            deploy_script=$(mktemp /tmp/filmott-blue-green-deploy.XXXXXX)
            trap 'rm -f "$deploy_script"' EXIT
            git show "${DEPLOY_SHA}:scripts/deploy-blue-green.sh" > "$deploy_script"
            chmod 700 "$deploy_script"
            FILMOTT_REPO_ROOT="$PWD" bash "$deploy_script" deploy "$DEPLOY_SHA"
      - name: Verify external site through Cloudflare
        run: |
          set -Eeuo pipefail

          for i in $(seq 1 24); do
            status=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' https://filmott.kr || true)
            if [ "$status" = "200" ]; then
              echo "External health check passed"
              break
            fi
            if [ $i -eq 24 ]; then
              echo "External health check failed: ${status}"
              exit 1
            fi
            sleep 5
          done

          www_status=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' https://www.filmott.kr || true)
          if [ "$www_status" != "301" ]; then
            echo "External www redirect check failed: ${www_status}"
            exit 1
          fi

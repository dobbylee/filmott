name: Deploy
run-name: Deploy ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified commit
        # v1.2.5
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -Eeuo pipefail

            cd ~/filmott

            if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid deploy SHA: ${DEPLOY_SHA}"
              exit 1
            fi
            echo "Deploy target: ${DEPLOY_SHA}"

            lock_file="${FILMOTT_OPS_LOCK_FILE:-/var/lock/filmott-ops.lock}"
            exec 9>"$lock_file"
            if ! flock -w 900 9; then
              echo "Another production operation is still running: ${lock_file}"
              exit 1
            fi

            compose() {
              docker compose --env-file .env -f docker-compose.prod.yml "$@"
            }

            print_diagnostics() {
              echo "=== docker compose ps ==="
              compose ps || true
              echo "=== frontend/backend/nginx logs ==="
              compose logs --tail=160 frontend backend nginx || true
            }

            wait_for_backend() {
              for i in $(seq 1 12); do
                if docker exec "$(compose ps -q backend)" wget -q -O- http://localhost:3001/api/ > /dev/null 2>&1; then
                  echo "Backend is healthy"
                  return 0
                fi
                if [ "$i" -lt 12 ]; then
                  sleep 5
                fi
              done
              echo "Backend not responding"
              return 1
            }

            wait_for_frontend() {
              for i in $(seq 1 24); do
                if compose exec -T frontend \
                  node -e "fetch('http://127.0.0.1:3000/robots.txt', { cache: 'no-store' }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                  echo "Frontend is healthy"
                  return 0
                fi
                if [ "$i" -lt 24 ]; then
                  sleep 5
                fi
              done
              echo "Frontend not responding"
              return 1
            }

            cutover_started=0
            checkout_changed=0
            rollback_ready=0
            previous_head=""
            previous_frontend_ref=""
            previous_backend_ref=""

            restore_previous_checkout() {
              git reset --hard "$previous_head" || return 1
              [ "$(git rev-parse HEAD)" = "$previous_head" ] || return 1
            }

            restore_previous_build_state() {
              echo "Restoring previous checkout and frontend/backend image tags"
              docker image tag filmott-frontend:rollback "$previous_frontend_ref" || return 1
              docker image tag filmott-backend:rollback "$previous_backend_ref" || return 1
              [ "$(docker image inspect -f '{{.Id}}' "$previous_frontend_ref")" = "$previous_frontend_image" ] || return 1
              [ "$(docker image inspect -f '{{.Id}}' "$previous_backend_ref")" = "$previous_backend_image" ] || return 1
              restore_previous_checkout || return 1
            }

            restore_previous_release() {
              echo "Restoring previous frontend/backend release"
              restore_previous_build_state || return 1
              compose up -d --no-deps --force-recreate frontend backend || return 1
              wait_for_backend || return 1
              wait_for_frontend || return 1
              compose restart nginx || return 1
              echo "Previous frontend/backend release restored"
            }

            handle_deploy_error() {
              status=$?
              trap - ERR
              echo "Deploy failed"
              print_diagnostics

              if [ "$cutover_started" = "1" ] && [ "$rollback_ready" = "1" ]; then
                if ! restore_previous_release; then
                  echo "Automatic rollback failed"
                  print_diagnostics
                fi
              elif [ "$rollback_ready" = "1" ]; then
                if ! restore_previous_build_state; then
                  echo "Failed to restore checkout or image tags after pre-cutover failure"
                fi
              elif [ "$checkout_changed" = "1" ]; then
                if ! restore_previous_checkout; then
                  echo "Failed to restore checkout after pre-cutover failure"
                fi
              fi

              exit "$status"
            }

            trap handle_deploy_error ERR

            fail_deploy() {
              echo "$1"
              return 1
            }

            test -f .env
            test -f backend/.env.production
            for var in DB_NAME DB_USERNAME DB_PASSWORD REVALIDATE_SECRET; do
              if ! grep -q "^${var}=" .env; then
                echo "Missing ${var} in ~/filmott/.env"
                exit 1
              fi
            done

            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

            if ! git cat-file -e "${DEPLOY_SHA}^{commit}"; then
              echo "Deploy target is not a commit: ${DEPLOY_SHA}"
              exit 1
            fi
            latest_main_sha=$(git rev-parse origin/main)
            if [ "$DEPLOY_SHA" != "$latest_main_sha" ]; then
              echo "Skipping stale deploy target ${DEPLOY_SHA}; origin/main is ${latest_main_sha}"
              exit 0
            fi

            previous_head=$(git rev-parse HEAD)
            if ! git cat-file -e "${previous_head}^{commit}"; then
              echo "Previous checkout is not a commit: ${previous_head}"
              exit 1
            fi
            checkout_changed=1
            git reset --hard "$DEPLOY_SHA"
            if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
              fail_deploy "Checked-out SHA does not match deploy target"
            fi

            compose config > /dev/null
            previous_frontend_container=$(compose ps -q frontend)
            previous_backend_container=$(compose ps -q backend)
            if [ -z "$previous_frontend_container" ] || [ -z "$previous_backend_container" ]; then
              echo "Cannot preserve rollback images because frontend/backend is not running"
              exit 1
            fi

            previous_frontend_image=$(docker inspect -f '{{.Image}}' "$previous_frontend_container")
            previous_backend_image=$(docker inspect -f '{{.Image}}' "$previous_backend_container")
            previous_frontend_ref=$(docker inspect -f '{{.Config.Image}}' "$previous_frontend_container")
            previous_backend_ref=$(docker inspect -f '{{.Config.Image}}' "$previous_backend_container")
            docker image tag "$previous_frontend_image" filmott-frontend:rollback
            docker image tag "$previous_backend_image" filmott-backend:rollback
            rollback_ready=1

            compose build frontend backend

            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            latest_main_sha=$(git rev-parse origin/main)
            if [ "$DEPLOY_SHA" != "$latest_main_sha" ]; then
              echo "Skipping stale deploy target ${DEPLOY_SHA}; origin/main advanced to ${latest_main_sha} during build"
              restore_previous_build_state
              exit 0
            fi

            # PostgreSQL volume 변경은 별도 점검 절차로만 반영한다.
            # 앱 배포가 dependency인 postgres를 암묵적으로 재생성하지 않게 한다.
            cutover_started=1
            compose up -d --no-deps --remove-orphans frontend backend

            for service in frontend backend; do
              container_id=$(compose ps -q "$service")
              if [ -z "$container_id" ]; then
                fail_deploy "${service} container was not created"
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
                fail_deploy "${service} container is not running"
              fi
            done

            # 새 컨테이너 readiness check. 실패하면 ERR trap에서 이전 이미지로 복원한다.
            wait_for_backend
            wait_for_frontend

            # nginx 재시작 (컨테이너 IP 변경 시 upstream resolve 갱신)
            compose restart nginx

            # ISR 캐시 revalidation (에러 페이지 캐시 방지)
            REVAL_SECRET=$(grep REVALIDATE_SECRET ~/filmott/.env | cut -d= -f2-)
            if [ -n "$REVAL_SECRET" ]; then
              compose exec -T frontend \
                node -e "fetch('http://127.0.0.1:3000/internal/revalidate', {
                  method: 'POST',
                  headers: { 'Authorization': 'Bearer $REVAL_SECRET', 'Content-Type': 'application/json' },
                  body: JSON.stringify({path:'/', tags:['rankings','recent-reviews']})
                }).then(r => {
                  if (!r.ok) throw new Error('Revalidate failed: ' + r.status);
                  return r.text();
                }).then(console.log)"
              echo "ISR cache revalidated"
              compose exec -T frontend \
                node -e "fetch('http://127.0.0.1:3000/', { cache: 'no-store' }).then(r => {
                  if (!r.ok) throw new Error('Frontend warm failed: ' + r.status);
                  console.log('Frontend / warmed:', r.status);
                })"
            fi

            for i in $(seq 1 24); do
              status=$(curl -sS --resolve filmott.kr:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://filmott.kr || true)
              if [ "$status" = "200" ]; then
                echo "Origin health check passed"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "Origin is still not healthy, restarting nginx once..."
                compose restart nginx
              fi
              if [ $i -eq 24 ]; then
                fail_deploy "Origin health check failed: ${status}"
              fi
              sleep 5
            done

            www_status=$(curl -sS --resolve www.filmott.kr:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://www.filmott.kr || true)
            if [ "$www_status" != "301" ]; then
              fail_deploy "www redirect check failed: ${www_status}"
            fi
      - name: Verify external site through Cloudflare
        run: |
          set -Eeuo pipefail

          for i in $(seq 1 24); do
            status=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' https://filmott.kr || true)
            if [ "$status" = "200" ]; then
              echo "External health check passed"
              break
            fi
            if [ $i -eq 24 ]; then
              echo "External health check failed: ${status}"
              exit 1
            fi
            sleep 5
          done

          www_status=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' https://www.filmott.kr || true)
          if [ "$www_status" != "301" ]; then
            echo "External www redirect check failed: ${www_status}"
            exit 1
          fi

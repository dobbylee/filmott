x-frontend-common: &frontend-common
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_API_URL: https://filmott.kr/api
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
  environment: &frontend-environment
    NODE_ENV: production
    HOSTNAME: 0.0.0.0
    REVALIDATE_SECRET: ${REVALIDATE_SECRET}
  healthcheck: &frontend-healthcheck
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/robots.txt', { cache: 'no-store' }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  restart: unless-stopped

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ./backend/.env.production
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck: &backend-healthcheck
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3001/api/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  restart: unless-stopped

x-backend-environment: &backend-environment
  NODE_ENV: production
  DB_HOST: postgres
  FRONTEND_URL: https://filmott.kr
  TZ: Asia/Seoul

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ${FILMOTT_DEPLOY_STATE_DIR:-./.deploy-state}/nginx:/etc/nginx/runtime:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  frontend-blue:
    <<: *frontend-common
    image: filmott-frontend:blue

  frontend-green:
    <<: *frontend-common
    image: filmott-frontend:green

  backend-blue:
    <<: *backend-common
    image: filmott-backend:blue
    environment:
      <<: *backend-environment
      FRONTEND_INTERNAL_URL: http://frontend-blue:3000

  backend-green:
    <<: *backend-common
    image: filmott-backend:green
    environment:
      <<: *backend-environment
      FRONTEND_INTERNAL_URL: http://frontend-green:3000

  # 최초 blue-green bootstrap이 완료될 때까지만 기존 컨테이너를 인식한다.
  # profile을 명시하지 않은 일반 배포에서는 새로 시작되지 않는다.
  frontend:
    <<: *frontend-common
    image: filmott-frontend:latest
    profiles: [legacy]

  backend:
    <<: *backend-common
    image: filmott-backend:latest
    profiles: [legacy]
    environment:
      <<: *backend-environment
      FRONTEND_INTERNAL_URL: http://frontend:3000

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    command:
      - postgres
      - -c
      - shared_buffers=6GB
      - -c
      - effective_cache_size=18GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=150
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - log_min_duration_statement=1000
    shm_size: '8g'
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
